services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      CONFIG_FILE: config.docker.yml
    networks:
      - payflow
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox_worker:
    build: .
    command: python -m src.infra.outbox
    env_file:
      - .env
    environment:
      CONFIG_FILE: config.docker.yml
    networks:
      - payflow
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer_worker:
    build: .
    command: python -m src.infra.messaging
    env_file:
      - .env
    environment:
      CONFIG_FILE: config.docker.yml
    networks:
      - payflow
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migrations:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      CONFIG_FILE: config.docker.yml
    networks:
      - payflow
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"
      - "5672:5672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD}
    volumes:
      - payflow_broker_data:/var/lib/rabbitmq
    networks:
      - payflow
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_DATABASE}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - payflow_db_data:/var/lib/postgresql/data/
    networks:
      - payflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  payflow_broker_data:
  payflow_db_data:

networks:
  payflow:
